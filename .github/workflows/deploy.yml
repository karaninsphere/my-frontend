name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "447343943134"
  ECR_REPOSITORY: my-frontend

jobs:
  build-and-push:
    name: Build and Push to Amazon ECR
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::447343943134:role/github-ecr-access
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-ECR

      # --------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # --------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          echo "Registry: $ECR_REGISTRY"
          echo "Repository: $ECR_REPOSITORY"
          echo "Tag: $IMAGE_TAG"

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # --------------------------------------------------
      # Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Pushing Docker image to ECR..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo ""
          echo "=========================================="
          echo "Docker image pushed successfully"
          echo "=========================================="
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "=========================================="

      # --------------------------------------------------
      # Verify image in ECR
      # --------------------------------------------------
      - name: Verify image in ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Checking image in ECR..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

          echo "ECR image verification successful."
