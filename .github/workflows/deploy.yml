name: Build and Push to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: my-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: ${{ github.event.repository.id }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Repository Owner ID: ${{ github.repository_owner_id }}"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::447343943134:role/github-ecr-access
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Image pushed successfully:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
